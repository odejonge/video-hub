services:
  # Database
  postgres:
    image: postgres:16-alpine
    container_name: videohub-db
    environment:
      POSTGRES_USER: videohub
      POSTGRES_PASSWORD: videohub
      POSTGRES_DB: videohub
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - videohub
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U videohub" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: videohub-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://videohub:videohub@postgres:5432/videohub
      NODE_ENV: development
      PORT: 3000
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      # Backend routes - only for ngrok host (uses ngrok entrypoint without redirect)
      - traefik.http.routers.videohub-backend.rule=Host(`e5e49d61233e.ngrok-free.app`) && (PathPrefix(`/api`) || PathPrefix(`/auth/google`) || PathPrefix(`/auth/facebook`) || PathPrefix(`/auth/me`) || PathPrefix(`/health`) || PathPrefix(`/webhooks`))
      - traefik.http.routers.videohub-backend.entrypoints=ngrok
      - traefik.http.routers.videohub-backend.priority=100
      - traefik.http.services.videohub-backend.loadbalancer.server.port=3000
    networks:
      - videohub
      - traefik_network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: videohub-frontend
    environment:
      VITE_API_URL: "" # Empty = same origin, uses relative paths
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    labels:
      - traefik.enable=true
      # Frontend - only for ngrok host (uses ngrok entrypoint without redirect)
      - traefik.http.routers.videohub-frontend.rule=Host(`e5e49d61233e.ngrok-free.app`) && PathPrefix(`/`)
      - traefik.http.routers.videohub-frontend.entrypoints=ngrok
      - traefik.http.routers.videohub-frontend.priority=1
      - traefik.http.services.videohub-frontend.loadbalancer.server.port=5173
    networks:
      - videohub
      - traefik_network

volumes:
  postgres_data:


networks:
  videohub:
    driver: bridge
  traefik_network:
    external: true
