version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: videohub-db
    environment:
      POSTGRES_USER: videohub
      POSTGRES_PASSWORD: videohub
      POSTGRES_DB: videohub
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

